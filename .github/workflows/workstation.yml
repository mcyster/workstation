name: Workstation
on:
  workflow_dispatch:
    inputs:
      action:
        description: Action (web-terminal sets up browser access and issues a new password; secrets applies OpenCode env secrets)
        type: choice
        required: true
        options: [create, configure, start, stop, web-terminal, secrets, list, recover, destroy]
      name:
        description: Workstation name
        type: string
        default: main
      machine_type:
        description: GCE machine type for create
        type: string
        default: e2-standard-2
      boot_disk_size:
        description: GCE boot disk size in GB for create
        type: string
        default: "100"
      web_terminal:
        description: Set up browser access on create
        type: boolean
        default: true
permissions:
  id-token: write
  contents: read
jobs:
  workstation:
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ vars.WORKSTATION_GCLOUD_PROJECT }}
      ZONE: ${{ vars.WORKSTATION_GCLOUD_ZONE || 'us-central1-a' }}
      PROVIDER: ${{ secrets.WORKSTATION_GCLOUD_WORKLOAD_IDENTITY_PROVIDER }}
      SERVICE_ACCOUNT: ${{ secrets.WORKSTATION_GCLOUD_SERVICE_ACCOUNT }}
      ACTION: ${{ inputs.action }}
      NAME: ${{ inputs.name }}
      MACHINE_TYPE: ${{ inputs.machine_type }}
      BOOT_DISK_SIZE: ${{ inputs.boot_disk_size }}
      WEB_TERMINAL: ${{ inputs.web_terminal }}
      # OpenCode user secrets in dotenv form (e.g. OPENROUTER_API_KEY, GH_TOKEN);
      # applied by the `secrets` action to the opencode service environment.
      WORKSTATION_ENV_OPENCODE: ${{ secrets.WORKSTATION_ENV_OPENCODE }}
    steps:
      - uses: actions/checkout@v4
      - name: Check cloud configuration
        shell: bash
        run: |
          for variable in PROJECT PROVIDER SERVICE_ACCOUNT; do
            if [[ -z "${!variable}" ]]; then echo "::error::$variable is not configured"; exit 1; fi
          done
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Install Nix
        # Only configure builds and pushes the flake closure; create and
        # recover boot the published bootstrap image and need no build.
        # Publish the image with the Publish image workflow when it changes.
        if: ${{ inputs.action == 'configure' }}
        uses: determinatesystems/nix-installer-action@v23
      - name: Manage workstation
        shell: bash
        run: |
          args=("$ACTION" "$NAME" --project "$PROJECT" --zone "$ZONE")
          if [[ "$ACTION" == create ]]; then
            args+=(--machine-type "$MACHINE_TYPE" --boot-disk-size "$BOOT_DISK_SIZE")
            [[ "$WEB_TERMINAL" != true ]] || args+=(--web-terminal)
          fi
          # destroy and recover are non-interactive in the workflow; confirm
          # them with --yes (create refuses on its own and needs no flag).
          if [[ "$ACTION" == destroy || "$ACTION" == recover ]]; then args+=(--yes); fi
          bash scripts/workstation "${args[@]}" > output.txt
          {
            echo "## Workstation $NAME"
            echo "- Action: $ACTION"
            echo "- Project: $PROJECT"
            echo "- Zone: $ZONE"
            sed -n 's/^opencode: /- Open Code: /p' output.txt
            sed -n 's/^coder: /- Coder: /p' output.txt
            sed -n 's/^password: /- Password: /p' output.txt
            sed -n 's/^serial recovery: /- Serial recovery: /p' output.txt
            echo '### Machines'
            echo '| Name | Status | Machine type | Zone | IP | Password | Coder | Open Code |'
            echo '| --- | --- | --- | --- | --- | --- | --- | --- |'
            while IFS=, read -r machine status machine_type zone ip coder opencode password; do
              [[ -n "$machine" ]] || continue
              password_link='—'
              coder_link='—'
              opencode_link='—'
              [[ -z "$password" ]] || password_link="[Secret Manager]($password)"
              [[ -z "$coder" ]] || coder_link="[Open]($coder)"
              [[ -z "$opencode" ]] || opencode_link="[Open]($opencode)"
              echo "| $machine | $status | $machine_type | $zone | $ip | $password_link | $coder_link | $opencode_link |"
            done < <(bash scripts/workstation list --project "$PROJECT" || true)
          } >> "$GITHUB_STEP_SUMMARY"