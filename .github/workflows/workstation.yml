name: Workstation
on:
  workflow_dispatch:
    inputs:
      action:
        description: Action (web-terminal sets up browser access and issues a new password)
        type: choice
        required: true
        options: [create, configure, start, stop, web-terminal, list, recover, destroy]
      name:
        description: Workstation name
        type: string
        default: main
      machine_type:
        description: GCE machine type for create
        type: string
        default: e2-standard-2
      boot_disk_size:
        description: GCE boot disk size in GB for create
        type: string
        default: "100"
      web_terminal:
        description: Set up browser access on create
        type: boolean
        default: true
permissions:
  id-token: write
  contents: read
jobs:
  workstation:
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ vars.WORKSTATION_GCLOUD_PROJECT }}
      ZONE: ${{ vars.WORKSTATION_GCLOUD_ZONE || 'us-central1-a' }}
      PROVIDER: ${{ secrets.WORKSTATION_GCLOUD_WORKLOAD_IDENTITY_PROVIDER }}
      SERVICE_ACCOUNT: ${{ secrets.WORKSTATION_GCLOUD_SERVICE_ACCOUNT }}
      ACTION: ${{ inputs.action }}
      NAME: ${{ inputs.name }}
      MACHINE_TYPE: ${{ inputs.machine_type }}
      BOOT_DISK_SIZE: ${{ inputs.boot_disk_size }}
      WEB_TERMINAL: ${{ inputs.web_terminal }}
    steps:
      - uses: actions/checkout@v4
      - name: Check cloud configuration
        shell: bash
        run: |
          for variable in PROJECT PROVIDER SERVICE_ACCOUNT; do
            if [[ -z "${!variable}" ]]; then echo "::error::$variable is not configured"; exit 1; fi
          done
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Install Nix
        # Only create and recover build the base NixOS disk image.
        if: ${{ inputs.action == 'create' || inputs.action == 'recover' }}
        uses: determinatesystems/nix-installer-action@v23
      - name: Manage workstation
        shell: bash
        run: |
          args=("$ACTION" "$NAME" --project "$PROJECT" --zone "$ZONE")
          if [[ "$ACTION" == create ]]; then
            args+=(--machine-type "$MACHINE_TYPE" --boot-disk-size "$BOOT_DISK_SIZE")
            [[ "$WEB_TERMINAL" != true ]] || args+=(--web-terminal)
          fi
          bash scripts/workstation "${args[@]}" > output.txt
          {
            echo "## Workstation $NAME"
            echo "- Action: $ACTION"
            echo "- Project: $PROJECT"
            echo "- Zone: $ZONE"
            sed -n 's/^browser: /- Browser: /p' output.txt
            sed -n 's/^password: /- Password: /p' output.txt
            sed -n 's/^recovery: /- Recovery: /p' output.txt
            echo '### Machines'
            echo '| Name | Status | Machine type | Zone | IP | Browser | Password | Recovery |'
            echo '| --- | --- | --- | --- | --- | --- | --- | --- |'
            while IFS=, read -r machine status machine_type zone ip browser password recovery; do
              [[ -n "$machine" ]] || continue
              browser_link='—'
              password_link='—'
              recovery_link='—'
              [[ -z "$browser" ]] || browser_link="[Open]($browser)"
              [[ -z "$password" ]] || password_link="[Secret Manager]($password)"
              [[ -z "$recovery" ]] || recovery_link="[Secret Manager]($recovery)"
              echo "| $machine | $status | $machine_type | $zone | $ip | $browser_link | $password_link | $recovery_link |"
            done < <(bash scripts/workstation list --project "$PROJECT" || true)
          } >> "$GITHUB_STEP_SUMMARY"