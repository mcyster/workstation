name: Workstation
on:
  workflow_dispatch:
    inputs:
      action:
        description: Action (web-terminal sets up access and issues a new password)
        type: choice
        required: true
        options: [create, configure, idle-shutdown, opencode, start, stop, web-terminal, list, destroy]
      name:
        description: Workstation name
        type: string
        default: main
      machine_type:
        description: GCE machine type for create
        type: string
        default: e2-standard-2
      web_terminal:
        description: Browser editor on create
        type: boolean
        default: true
      opencode:
        description: OpenCode web UI on create
        type: boolean
        default: true
      environment:
        description: Comma-separated environment apps from apps.json to configure, in order
        type: string
        required: false
permissions:
  id-token: write
  contents: read
jobs:
  workstation:
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ vars.WORKSTATION_GCLOUD_PROJECT }}
      ZONE: ${{ vars.WORKSTATION_GCLOUD_ZONE || 'us-central1-a' }}
      PROVIDER: ${{ secrets.WORKSTATION_GCLOUD_WORKLOAD_IDENTITY_PROVIDER }}
      SERVICE_ACCOUNT: ${{ secrets.WORKSTATION_GCLOUD_SERVICE_ACCOUNT }}
      ACTION: ${{ inputs.action }}
      NAME: ${{ inputs.name }}
      MACHINE_TYPE: ${{ inputs.machine_type }}
      WEB_TERMINAL: ${{ inputs.web_terminal }}
      OPENCODE: ${{ inputs.opencode }}
      WORKSTATION_ENV_CODE: ${{ secrets.WORKSTATION_ENV_CODE }}
      WORKSTATION_ENV_OPENCODE: ${{ secrets.WORKSTATION_ENV_OPENCODE }}
      WORKSTATION_ENV_TOG: ${{ secrets.WORKSTATION_ENV_TOG }}
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Check cloud configuration
        shell: bash
        run: |
          for variable in PROJECT PROVIDER SERVICE_ACCOUNT; do
            if [[ -z "${!variable}" ]]; then echo "::error::$variable is not configured"; exit 1; fi
          done
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Manage workstation
        shell: bash
        run: |
          if [[ "$ACTION" == configure ]]; then
            if [[ -z "$ENVIRONMENT" ]]; then echo '::error::configure requires an environment'; exit 1; fi
            echo "environment: $ENVIRONMENT" > output.txt
          else
            args=("$ACTION" "$NAME" --project "$PROJECT" --zone "$ZONE")
            if [[ "$ACTION" == create ]]; then
              args+=(--machine-type "$MACHINE_TYPE")
              [[ "$WEB_TERMINAL" != true ]] || args+=(--web-terminal)
              [[ "$OPENCODE" != true ]] || args+=(--opencode)
            fi
            if [[ "$ACTION" == destroy ]]; then args+=(--yes); fi
            bash scripts/workstation "${args[@]}" > output.txt
          fi
          {
            echo "## Workstation $NAME"
            echo "- Action: $ACTION"
            echo "- Project: $PROJECT"
            echo "- Zone: $ZONE"
            sed -n 's/^web terminal: /- Browser: /p' output.txt
            sed -n 's/^password: /- Password: /p' output.txt
            echo '### Machines'
            echo '| Name | Status | Machine type | Zone | IP | Web terminal | OpenCode | Password |'
            echo '| --- | --- | --- | --- | --- | --- | --- | --- |'
            while IFS=, read -r machine status machine_type zone ip web_terminal opencode password; do
              [[ -n "$machine" ]] || continue
              web_terminal_link='—'
              opencode_link='—'
              password_link='—'
              [[ -z "$web_terminal" ]] || web_terminal_link="[Open]($web_terminal)"
              [[ -z "$opencode" ]] || opencode_link="[Open]($opencode)"
              [[ -z "$password" ]] || password_link="[Secret Manager]($password)"
              echo "| $machine | $status | $machine_type | $zone | $ip | $web_terminal_link | $opencode_link | $password_link |"
            done < <(bash scripts/workstation list --project "$PROJECT" || true)
          } >> "$GITHUB_STEP_SUMMARY"
  discover_environment:
    needs: workstation
    if: ${{ always() && needs.workstation.result == 'success' && inputs.environment != '' && (inputs.action == 'create' || inputs.action == 'configure') }}
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.secrets.outputs.environments }}
    steps:
      - uses: actions/checkout@v4
      - name: Read environment requirements
        id: secrets
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          environment_input="${ENVIRONMENT//[, ]/ }"
          environment_input="${environment_input//$'\n'/ }"
          read -r -a candidate_names <<< "$environment_input"
          environment_names=()
          for name in "${candidate_names[@]}"; do
            [[ -n "$name" ]] || continue
            [[ "$name" =~ ^[a-z]([-a-z0-9]*[a-z0-9])?$ ]] || { echo "::error::Invalid environment name: $name"; exit 1; }
            jq -e --arg app "$name" '.[$app].environment == true' apps.json >/dev/null 2>&1 || { echo "::error::$name is not a configurable environment app"; exit 1; }
            setup="$(jq -r --arg app "$name" '.[$app].setup // empty' apps.json)"
            [[ -n "$setup" && -f "$setup" ]] || { echo "::error::No setup script for app $name"; exit 1; }
            for seen in "${environment_names[@]}"; do [[ "$seen" == "$name" ]] && continue 2; done
            environment_names+=("$name")
          done
          ((${#environment_names[@]})) || { echo '::error::No environments given'; exit 1; }

          environment_list_json='['
          separator=''
          for index in "${!environment_names[@]}"; do
            environment_list_json+="${separator}\"${environment_names[$index]}\""
            separator=','
          done
          environment_list_json+=']'
          printf 'environments=%s\n' "$environment_list_json" >> "$GITHUB_OUTPUT"
  configure:
    needs: [workstation, discover_environment]
    if: ${{ always() && needs.workstation.result == 'success' && needs.discover_environment.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.discover_environment.outputs.environments || '[]') }}
    environment: ${{ matrix.environment }}
    env:
      PROJECT: ${{ vars.WORKSTATION_GCLOUD_PROJECT }}
      ZONE: ${{ vars.WORKSTATION_GCLOUD_ZONE || 'us-central1-a' }}
      PROVIDER: ${{ secrets.WORKSTATION_GCLOUD_WORKLOAD_IDENTITY_PROVIDER }}
      SERVICE_ACCOUNT: ${{ secrets.WORKSTATION_GCLOUD_SERVICE_ACCOUNT }}
      NAME: ${{ inputs.name }}
      ENVIRONMENT: ${{ matrix.environment }}
      WORKSTATION_ENV_CODE: ${{ secrets.WORKSTATION_ENV_CODE }}
      WORKSTATION_ENV_OPENCODE: ${{ secrets.WORKSTATION_ENV_OPENCODE }}
      WORKSTATION_ENV_TOG: ${{ secrets.WORKSTATION_ENV_TOG }}
    steps:
      - uses: actions/checkout@v4
      - name: Check cloud configuration
        shell: bash
        run: |
          for variable in PROJECT PROVIDER SERVICE_ACCOUNT; do
            if [[ -z "${!variable}" ]]; then echo "::error::$variable is not configured"; exit 1; fi
          done
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure environment
        shell: bash
        run: |
          bash scripts/workstation configure "$NAME" \
            --project "$PROJECT" \
            --zone "$ZONE" \
            --environment "$ENVIRONMENT" > output.txt
          {
            echo "## Environment $ENVIRONMENT"
            echo "- Workstation: $NAME"
            echo "- Project: $PROJECT"
            sed -n 's/^environment: /- Applied: /p' output.txt
          } >> "$GITHUB_STEP_SUMMARY"
