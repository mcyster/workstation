name: Shell tests
on:
  pull_request:
    paths:
      - 'infra/**'
      - 'scripts/**'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'scripts/**'
      - 'tests/**'
permissions:
  contents: read
jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shell tests
        run: bash tests/secrets-test
